<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大傻憨</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: -apple-system, "PingFang SC", sans-serif;
      background: #0f1115;
      color: #e6e8ec;
    }
    .logo { font-size: 72px; }
    h1 { font-size: 22px; font-weight: 600; }
    #status { font-size: 14px; color: #9aa0aa; max-width: 520px; text-align: center; word-break: break-all; }
    .bar { width: 260px; height: 4px; border-radius: 2px; background: #24272e; overflow: hidden; }
    .bar > div { width: 40%; height: 100%; background: #4f8cff; border-radius: 2px; animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
    #retry { display: none; padding: 8px 22px; border: 0; border-radius: 8px; background: #4f8cff; color: #fff; font-size: 14px; cursor: pointer; }
    #retry:hover { background: #3b74e0; }
  </style>
</head>
<body>
  <div class="logo">🐶</div>
  <h1>大傻憨</h1>
  <div id="barBox" class="bar"><div></div></div>
  <div id="status">正在启动…</div>
  <button id="retry">重试</button>

  <script>
    const { listen } = window.__TAURI__.event;
    const { invoke } = window.__TAURI__.core;

    const status = document.getElementById("status");
    const barBox = document.getElementById("barBox");
    const retry = document.getElementById("retry");

    listen("boot-progress", (e) => { status.textContent = e.payload.message; });

    listen("boot-error", (e) => {
      status.textContent = e.payload.message;
      barBox.style.display = "none";
      retry.style.display = "block";
    });

    retry.addEventListener("click", () => {
      retry.style.display = "none";
      barBox.style.display = "block";
      status.textContent = "正在重试…";
      invoke("retry_boot");
    });
  </script>
</body>
</html>
