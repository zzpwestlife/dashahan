name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 arm64 编译目标
        run: rustup target add aarch64-apple-darwin

      - name: 安装依赖 (官方 registry, 绕过本机内网 lock)
        run: |
          # 仓库 package-lock.json 锁定了内网 registry (registry.npm.oa.com),
          # GitHub Actions runner 无法访问会 404; 删除后用官方 registry 重新解析.
          rm -f package-lock.json
          npm install --registry=https://registry.npmjs.org/

      - name: 构建轻量版 (arm64, 系统 Node)
        run: npm run build -- --target aarch64-apple-darwin
        env:
          DASH_LITE: "1"

      - name: 保存轻量版产物
        run: |
          mkdir -p /tmp/dash-lite
          cp -R src-tauri/target/aarch64-apple-darwin/release/bundle/macos/DASH.app /tmp/dash-lite/
          cp -R src-tauri/target/aarch64-apple-darwin/release/bundle/dmg /tmp/dash-lite/dmg 2>/dev/null || true

      - name: 下载内嵌 Node + 构建完整版 (arm64, 内嵌 Node)
        run: |
          ./scripts/fetch-node-dist.sh
          npm run build -- --config tauri.full.conf.json --target aarch64-apple-darwin

      - name: 安装完整版 app 并跑冒烟测试 (发版门禁)
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/DASH.app"
          rm -rf /Applications/DASH.app
          cp -R "$APP" /Applications/
          xattr -dr com.apple.quarantine /Applications/DASH.app 2>/dev/null || true
          ./scripts/smoke-test.sh

      - name: 打包双版本 zip (app + 各自安装说明)
        run: |
          mkdir -p dist-full dist-lite
          # 完整版
          cp -R "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/DASH.app" dist-full/
          cp 安装说明.txt dist-full/安装说明.txt
          cd dist-full && zip -r -q ../DASH-macOS-full.zip DASH.app 安装说明.txt && cd ..
          # 轻量版
          cp -R "/tmp/dash-lite/DASH.app" dist-lite/
          cp 安装说明-lite.txt dist-lite/安装说明.txt
          cd dist-lite && zip -r -q ../DASH-macOS-lite.zip DASH.app 安装说明.txt && cd ..

      - name: 创建 Release (挂 DMG + 双版本 zip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DMG=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          ASSETS="DASH-macOS-full.zip DASH-macOS-lite.zip"
          [ -n "$DMG" ] && ASSETS="$ASSETS $DMG"
          gh release create "$VERSION" $ASSETS \
            --title "DASH $VERSION" \
            --notes "自动构建发布 (GitHub Actions). 完整版(内嵌Node)+轻量版(需系统Node). 内含 dsh 0.1.0-rc.6."
